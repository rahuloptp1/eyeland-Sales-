<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyeland Sales Performance</title>
<style>
:root{--red:#c8102e;--ink:#1d1d1f;--mut:#6b6b70;--line:#e4e4e8;--bg:#f6f6f8;--ok:#1a7f37;--warn:#b35c00}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header .brand{font-weight:800}
header .brand span{color:var(--red)}
main{padding:12px 12px 96px;max-width:780px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:12px;color:var(--mut);cursor:pointer}
nav button.on{color:var(--red);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:2px 0 10px}
h3{font-size:15px;margin:0 0 6px}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:14px;margin:3px 4px 3px 0;cursor:pointer;color:var(--ink);font-family:inherit}
.btn.on{background:var(--red);color:#fff;border-color:var(--red)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.del{color:var(--red)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin:4px 0 10px;font-family:inherit;background:#fff}
textarea{min-height:110px}
label{font-size:13px;color:var(--mut);display:block}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;background:#f0f0f3;border-radius:6px;padding:2px 7px;font-size:12px;margin:2px 3px 2px 0}
.tag.no{background:#fde8eb;color:var(--red)}
.price{font-weight:800;font-size:18px}
.reason{border-left:3px solid var(--red);padding:6px 10px;margin:8px 0;background:#fff7f8;border-radius:0 8px 8px 0}
.say{background:#f1f8f3;border-left:3px solid var(--ok);padding:8px 10px;margin:8px 0;border-radius:0 8px 8px 0}
.note{background:#fff8ec;border-left:3px solid var(--warn);padding:8px 10px;margin:8px 0;border-radius:0 8px 8px 0}
.tier{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.tier.rec{border:2px solid var(--red)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:20px}.kpi .kpiRange{display:block;color:var(--mut);font-size:11px;margin-top:3px}.dashSection{margin:12px 0 4px;font-weight:700}.dashTableRange{font-size:11px;color:var(--mut);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.barw{background:#f0f0f3;border-radius:4px;height:8px;margin-top:3px}
.bar{height:8px;background:var(--red);border-radius:4px}
.warn{color:var(--warn)}
.ok{color:var(--ok)}
.bad{color:var(--red)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.sec{margin:14px 0 4px;font-weight:700}
#login{max-width:360px;margin:60px auto;padding:0 16px}
.hide{display:none}
</style>

/* ===== Auth ===== */
function friendlyErr(e){
  var c = (e && e.code) || '';
  if (c.indexOf('invalid') > -1 || c.indexOf('wrong-password') > -1 || c.indexOf('user-not-found') > -1) return 'Wrong email or password.';
  if (c.indexOf('too-many') > -1) return 'Too many tries. Wait a few minutes.';
  if (c.indexOf('network') > -1) return 'No internet connection.';
  return (e && e.message) || 'Sign-in failed.';
}
function doLogin(){
  $('lerr').textContent = '';
  auth.signInWithEmailAndPassword($('lemail').value.trim(), $('lpass').value).catch(function(err){ $('lerr').textContent = friendlyErr(err); });
}
$('lpass').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });

auth.onAuthStateChanged(function(u){
  USER = u;
  if (!u) { $('app').className = 'hide'; $('login').className = ''; return; }
  $('login').className = 'hide'; $('app').className = '';
  $('view').innerHTML = '<div class="card mut">Loading…</div>';
  loadCfg();
});

function loadCfg(){
  db.collection('sales_config').doc('main').get().then(function(doc){
    if (doc.exists) { CFG = doc.data(); render(); return; }
    CFG = seed(USER.email);
    return db.collection('sales_config').doc('main').set(CFG).then(function(){ render(); });
  }).catch(function(err){
    $('view').innerHTML = '<div class="card bad">Could not load settings: ' + esc(err.message) + '</div>';
  });
}

function saveCfg(note){
  CFG.updated = today();
  return db.collection('sales_config').doc('main').set(CFG).then(function(){
    if (note) {
      return db.collection('sales_changes').add({date: today(), type: 'Price list', what: note, why: '', outcome: '', ts: Date.now(), by: USER.email});
    }
  }).catch(function(err){ alert('Save failed: ' + err.message); });
}

/* ===== Pricing logic ===== */
function tiersFor(cat){
  if (cat === 'prog') return CFG.prog.slice();
  if (cat === 'bif') return CFG.sv.filter(function(t){ return t.priceAtt != null; });
  return CFG.sv.slice();
}
function featsOf(t, cat, frame){
  if (cat === 'prog' && frame === 'att' && t.attRemove) {
    return t.f.filter(function(k){ return t.attRemove.indexOf(k) < 0; });
  }
  return t.f;
}
function priceOf(t, cat, frame, pairs){
  if (cat === 'prog') return pairs === 1 ? t.p1 : t.p2;
  if (cat === 'bif') return t.priceAtt;
  return frame === 'att' ? t.priceAtt : t.price;
}
function priceLabel(t, cat, frame){
  if (cat === 'prog') return rs(t.p1) + ' for 1 · ' + rs(t.p2) + ' for 2';
  var p = priceOf(t, cat, frame, 2);
  return p == null ? 'Not available' : rs(p) + ' (2 pairs)';
}
function findTier(id){
  var all = CFG.sv.concat(CFG.prog);
  for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
  return null;
}

    }
  }
  var screenTask = {desk:'reading or desk work', detail:'detailed work', switch:'screen, papers and distance', other:'screen work'}[ANS.task];
  if (ANS.screenIssue === 'glare') add('Screen reflections during ' + screenTask, ['arc']);
  if (ANS.screenIssue === 'detail' && cat !== 'prog') add('Small details during ' + screenTask, ['hd']);
  if (ANS.screenIssue === 'switch' && cat === 'prog') add('Switching viewing distances during ' + screenTask, ['smooth']);
  if (ANS.drive === 'y') {
    add('Drives or rides at night', cat === 'prog' ? ['arc'] : ['arc','drive']);
  }
  if (ANS.sun === 'y') add('Out in the sun a lot', (cat === 'sv' && ANS.screen === 's0' && ANS.thick !== 'y') ? ['spf','sunprotect'] : ['spf']);
  if (ANS.thick === 'y') { r.thin = cat === 'prog' ? 21 : 35; add('Current glasses feel thick or heavy', ['thin']); }
  if (ANS.env === 'dust') add('Outdoor or dusty work', ['dust','water']);
  if (ANS.env === 'kid') { if (cat === 'prog') add('Very active lifestyle', ['crack']); else add('For a child or sports', ['shatter']); }
  return r;
}

function pick(cat, req, frame){
  var list = tiersFor(cat).filter(function(t){
    if (priceOf(t, cat, frame, 2) == null) return false;
    if (t.f.indexOf('shatter') > -1 && req.feats.indexOf('shatter') < 0) return false;
    if (t.f.indexOf('sunprotect') > -1 && req.feats.indexOf('sunprotect') < 0) return false;
    return true;
  });
  list.sort(function(a, b){ return priceOf(a, cat, frame, 2) - priceOf(b, cat, frame, 2); });
  function covers(t){
    var fs = featsOf(t, cat, frame);
    for (var i = 0; i < req.feats.length; i++) if (fs.indexOf(req.feats[i]) < 0) return false;
    return (t.thin || 0) >= req.thin;
  }
  var m = list.filter(covers);
  if (m.length) {
    var up = null;
    for (var i = 1; i < m.length; i++) {
      if (cat === 'prog') { if (m[i].cor > m[0].cor || featsOf(m[i], cat, frame).length > featsOf(m[0], cat, frame).length) { up = m[i]; break; } }
      else if (priceOf(m[i], cat, frame, 2) > priceOf(m[0], cat, frame, 2)) { up = m[i]; break; }
    }
    return {rec:m[0], up:up, missing:[]};
  }
  var best = null, bestScore = -1;
  for (var j = 0; j < list.length; j++) {
    var fs = featsOf(list[j], cat, frame), s = 0;
    for (var k = 0; k < req.feats.length; k++) if (fs.indexOf(req.feats[k]) > -1) s++;
    if ((list[j].thin || 0) >= req.thin) s++;
    if (s > bestScore) { bestScore = s; best = list[j]; }
  }
  var miss = [];
  if (best) {
    var bf = featsOf(best, cat, frame);
    for (var x = 0; x < req.feats.length; x++) if (bf.indexOf(req.feats[x]) < 0) miss.push(fname(req.feats[x]));
    if ((best.thin || 0) < req.thin) miss.push('Thinner lens (' + req.thin + '%)');
  }
  return {rec:best, up:null, missing:miss};
}

function tierBox(t, cat, frame, label, rec){
  if (!t) return '';
  var fs = featsOf(t, cat, frame);
  var h = '<div class="tier' + (rec ? ' rec' : '') + '"><div class="mut">' + esc(label) + '</div>';
  h += '<h3>' + esc(t.name) + (cat === 'prog' ? ' · ' + esc(CFG.corridors[t.cor] || '') + ' corridor' : ' · Card ' + esc(t.card)) + '</h3>';
  h += '<div class="price">' + priceLabel(t, cat, frame) + '</div><div>';
  for (var i = 0; i < fs.length; i++) h += '<span class="tag">' + esc(fname(fs[i])) + '</span>';
  if (t.thin) h += '<span class="tag">' + t.thin + '% thinner</span>';
  if (t.war) h += '<span class="tag">Warranty ' + esc(t.war) + '</span>';
  h += '</div></div>';
  return h;
}

function monthKey(d){ return d.slice(0, 7); }
function daysInMonth(key){ var p = key.split('-'); return new Date(+p[0], +p[1], 0).getDate(); }
function monthLabel(key){ var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; var p = key.split('-'); return m[+p[1] - 1] + ' ' + p[0]; }
function shiftMonth(key, n){ var p = key.split('-'); var d = new Date(+p[0], +p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
/* Eyeland pattern: the last ~12 days bring ~55% of a month's sales. Expected progress follows that curve, not a straight line. */
function paceShare(d, N){
  var k = Math.min(12, N), first = N - k;
  if (d <= 0) return 0;
  if (d >= N) return 1;
  if (d <= first) return first ? 0.45 * d / first : 0;
  return 0.45 + 0.55 * (d - first) / k;
}
function dashboardRange(p){
  var t = today(), from = t, to = t, label = 'Today';
  if (p === 'week') {
    var d = new Date();
    var dow = (d.getDay() + 6) % 7;
    from = addDays(t, -dow);
    label = 'This week';
  } else if (p === 'month') {
    from = t.slice(0, 8) + '01';
    label = 'This month';
  } else if (p === 'current15') {
    from = addDays(t, -14);
    label = 'Current 15 days';
  } else if (p === 'previous15') {
    from = addDays(t, -29);
    to = addDays(t, -15);
    label = 'Previous 15 days';
  }
  return {from:from, to:to, label:label};
}
function rangeNote(rg){ return '<span class="kpiRange">' + esc(rg.from) + ' to ' + esc(rg.to) + '</span>'; }
function periodButton(id, label){
  return '<button class="btn sm' + (DASH_PERIOD === id ? ' on' : '') + '" onclick="DASH_PERIOD=\\'' + id + '\\';renderTarget()">' + label + '</button>';
}
function renderTarget(){
  if (!MONTH) MONTH = monthKey(today());
  if (!CFG.targets) CFG.targets = {};
  var key = MONTH, N = daysInMonth(key), tg = CFG.targets[key] || null, own = isOwner();
  var cur = monthKey(today());
  var d = key === cur ? +today().slice(8, 10) : (key < cur ? N : 0);
  var rg = dashboardRange(DASH_PERIOD);
  var h = '<div class="card"><h2>Sales dashboard</h2><div class="mut">Choose a period. Every result below is calculated from logged customer records and shows its date range.</div><div style="margin-top:8px">' +
    periodButton('today','Today') + periodButton('week','This week') + periodButton('month','This month') + periodButton('current15','Current 15 days') + periodButton('previous15','Previous 15 days') +
    '</div><div class="tag">Selected: ' + esc(rg.label) + ' · ' + esc(rg.from) + ' to ' + esc(rg.to) + '</div></div>';
  h += '<div class="card"><div class="row" style="align-items:center"><button class="btn sm" style="flex:0" onclick="MONTH=shiftMonth(MONTH,-1);renderTarget()">◀</button><h2 style="text-align:center;margin:0">' + monthLabel(key) + ' target</h2><button class="btn sm" style="flex:0" onclick="MONTH=shiftMonth(MONTH,1);renderTarget()">▶</button></div>';
  if (own) {
    h += '<h3 style="margin-top:10px">' + (tg ? 'Update monthly targets' : 'Set monthly targets') + '</h3><div class="row"><div><label>Sales target ₹</label><input id="t_sales" type="number" min="0" value="' + (tg ? tg.sales : '') + '"></div><div><label>Bills target</label><input id="t_sales_bills" type="number" min="0" value="' + (tg ? (tg.bills != null ? tg.bills : tg.orders || 0) : '') + '"></div></div><button class="btn pri" onclick="saveTarget()">Save targets</button>';
  }
  h += '</div><div id="tgBody" class="card mut">' + (tg ? 'Loading…' : 'Set this month’s targets to see target progress.') + '</div>';
  h += '<div class="card"><h3>Target change history</h3><div id="targetHistory" class="mut">Loading…</div></div>';
  h += '<div id="fuBody" class="card"><h3>Follow-ups due</h3><div class="mut">Loading…</div></div>';
  $('view').innerHTML = h;
  loadFollowups();
  loadTargetHistory(key);
  var p1 = fetchRange(rg.from, rg.to);
  var monthTo = key === cur ? today() : key + '-' + pad(N);
  var p2 = fetchRange(key + '-01', monthTo);
  Promise.all([p1, p2]).then(function(res){
    if (!$('tgBody')) return;
    var selected = stats(res[0]), monthly = stats(res[1]);
    var body = '<h3>' + esc(rg.label) + ' performance</h3><div class="mut">' + esc(rg.from) + ' to ' + esc(rg.to) + '</div>';
    body += '<div class="kpi" style="margin-top:8px">';
    body += '<div>Net sales<b>' + rs(selected.rev) + '</b>' + rangeNote(rg) + '</div>';
    body += '<div>Bills<b>' + selected.b + '</b>' + rangeNote(rg) + '</div>';
    body += '<div>Customers logged<b>' + selected.n + '</b>' + rangeNote(rg) + '</div>';
    body += '<div>Conversion<b>' + selected.conv + '%</b><span class="mut">' + selected.known + ' known outcomes · ' + selected.excluded + ' excluded</span>' + rangeNote(rg) + '</div>';
    body += '<div>Average bill<b>' + rs(selected.avg) + '</b>' + rangeNote(rg) + '</div></div>';
    body += '<div class="dashSection">Monthly target · ' + esc(monthLabel(key)) + '</div><div class="mut">' + key + '-01 to ' + monthTo + '</div>';
    if (tg) {
      var salesTarget = +tg.sales || 0, billTarget = +(tg.bills != null ? tg.bills : tg.orders) || 0;
      var daysElapsed = Math.max(0, Math.min(N, d));
      var remainingDays = Math.max(0, N - daysElapsed);
      var expected = Math.round(salesTarget * paceShare(daysElapsed, N));
      var remainingSales = Math.max(0, salesTarget - monthly.rev);
      var avgDaily = daysElapsed ? monthly.rev / daysElapsed : 0;
      var neededDaily = remainingDays ? remainingSales / remainingDays : remainingSales;
      body += '<div class="kpi"><div>Sales progress<b>' + rs(monthly.rev) + ' / ' + rs(salesTarget) + '</b><span class="mut">' + pct(monthly.rev, salesTarget) + '% · ' + (monthly.rev >= expected ? 'on pace' : 'behind pace by ' + rs(expected - monthly.rev)) + '</span><span class="kpiRange">' + key + '-01 to ' + monthTo + '</span></div>';
      body += '<div>Bills progress<b>' + monthly.b + ' / ' + (billTarget || '—') + '</b><span class="mut">' + (billTarget ? pct(monthly.b, billTarget) + '% of target' : 'No bill target set') + '</span><span class="kpiRange">' + key + '-01 to ' + monthTo + '</span></div>';
      body += '<div>Still needed<b>' + rs(remainingSales) + '</b><span class="mut">to monthly sales target</span><span class="kpiRange">' + key + '-01 to ' + monthTo + '</span></div>';
      body += '<div>Daily sales pace<b>' + rs(Math.round(avgDaily)) + ' / day</b><span class="mut">' + rs(Math.round(neededDaily)) + ' / remaining day needed · ' + remainingDays + ' days left</span><span class="kpiRange">' + key + '-01 to ' + monthTo + '</span></div></div>';
    } else {
      body += '<div class="note">No sales or bill target is set for ' + esc(monthLabel(key)) + '. The owner can enter both above.</div>';
    }
    body += '<div class="dashSection">Sales by category <span class="dashTableRange">' + esc(rg.from) + ' to ' + esc(rg.to) + '</span></div><table><tr><th>Category</th><th>Bills</th><th>Net sales</th></tr>';
    var catKeys = Object.keys(selected.cats);
    if (!catKeys.length) body += '<tr><td colspan="3">No records in this period.</td></tr>';
    for (var ci = 0; ci < catKeys.length; ci++) {
      var catKey = catKeys[ci], cs = selected.cats[catKey];
      body += '<tr><td>' + esc(CATS[catKey] || catKey) + '</td><td>' + cs.b + '</td><td>' + rs(cs.rev) + '</td></tr>';
    }
    body += '</table><div class="dashSection">Sales by staff <span class="dashTableRange">' + esc(rg.from) + ' to ' + esc(rg.to) + '</span></div><table><tr><th>Staff</th><th>Customers</th><th>Bills</th><th>Net sales</th></tr>';
    for (var si = 0; si < STAFF_LABELS.length; si++) {
      var staffName = STAFF_LABELS[si], st = selected.staff[staffName] || {n:0,b:0,rev:0};
      body += '<tr><td>' + staffName + '</td><td>' + st.n + '</td><td>' + st.b + '</td><td>' + rs(st.rev) + '</td></tr>';
    }
    var un = selected.staff['Unassigned'] || {n:0,b:0,rev:0};
    if (un.n) body += '<tr><td>Unassigned (older logs)</td><td>' + un.n + '</td><td>' + un.b + '</td><td>' + rs(un.rev) + '</td></tr>';
    body += '</table><div class="dashSection">Lost-sale reasons <span class="dashTableRange">' + esc(rg.from) + ' to ' + esc(rg.to) + '</span></div>';
    var reasons = Object.keys(selected.reasons).sort(function(a,b){ return selected.reasons[b] - selected.reasons[a]; });
    if (!reasons.length) body += '<div class="mut">No lost sales recorded in this period.</div>';
    for (var ri = 0; ri < reasons.length; ri++) body += '<div class="tier">' + esc(reasons[ri]) + '<b style="float:right">' + selected.reasons[reasons[ri]] + '</b><span class="kpiRange">' + esc(rg.from) + ' to ' + esc(rg.to) + '</span></div>';
    $('tgBody').className = 'card';
    $('tgBody').innerHTML = body;
  }).catch(function(err){ if ($('tgBody')) $('tgBody').innerHTML = '<span class="bad">' + esc(err.message) + '</span>'; });
}
function loadTargetHistory(key){
  var el = $('targetHistory');
  db.collection('sales_target_history').where('month', '==', key).get().then(function(snap){
    var rows = [];
    snap.forEach(function(doc){ rows.push(doc.data()); });
    rows.sort(function(a,b){ return (b.changedAt || 0) - (a.changedAt || 0); });
    if (!rows.length) { el.innerHTML = '<span class="mut">No target changes recorded for this month yet.</span>'; return; }
    var html = '<table><tr><th>Changed</th><th>Sales target</th><th>Bills target</th><th>By</th></tr>';
    for (var i = 0; i < rows.length; i++) html += '<tr><td>' + esc(rows[i].changedDate || '') + '</td><td>' + rs(rows[i].sales) + '</td><td>' + (+rows[i].bills || 0) + '</td><td>' + esc(rows[i].by || '') + '</td></tr>';
    el.innerHTML = html + '</table>';
  }).catch(function(err){ el.innerHTML = '<span class="bad">' + esc(err.message) + '</span>'; });
}
function loadFollowups(){

    var rows = [];

    rows.sort(function(a, b){ return a.fuDue < b.fuDue ? -1 : 1; });
    var h = '<h3>Follow-ups due (' + rows.length + ')</h3><div class="mut">Customers who left without buying. Call or WhatsApp within 2 days.</div>';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i], due = r.fuDue <= today();

      h += '<div class="tier"><b>' + esc(r.name || 'No name') + '</b> · ' + esc(CATS[r.cat] || '') + (r.tierName ? ' · ' + esc(r.tierName) : '') + '<div class="mut">' + esc(r.reason) + ' · visited ' + esc(r.date) + ' · ' + (due ? '<span class="bad">due now</span>' : 'due ' + esc(r.fuDue)) + '</div>';
      h += '<a class="btn sm" href="tel:+91' + r.phone + '">Call</a><a class="btn sm" target="_blank" href="https://wa.me/91' + r.phone + '?text=' + msg + '">WhatsApp</a>';
      h += '<button class="btn sm on" onclick="closeFu(\'' + r._id + '\',\'won\')">Came back & bought</button><button class="btn sm" onclick="closeFu(\'' + r._id + '\',\'lost\')">Not interested</button></div>';
    }
    if (!rows.length) h += '<div class="mut" style="margin-top:6px">Nothing pending.</div>';
    $('fuBody').innerHTML = h;
  }).catch(function(err){ $('fuBody').innerHTML = '<span class="bad">' + esc(err.message) + '</span>'; });
}
function closeFu(id, v){
  if (v === 'won') alert('Also log their purchase as a new customer entry (source: Old customer is fine).');
  db.collection('sales_log').doc(id).update({fu: v, fuClosed: today()}).then(loadFollowups);
}
function groupTable(title, obj){
  var keys = Object.keys(obj).sort(function(a, b){ return obj[b].n - obj[a].n; });
  if (!keys.length) return '';
  var h = '<div class="sec">' + esc(title) + '</div><table><tr><th></th><th>Customers</th><th>Bought</th><th>Conv.</th><th>Sales</th></tr>';
  for (var i = 0; i < keys.length; i++) { var x = obj[keys[i]]; h += '<tr><td>' + esc(keys[i]) + '</td><td>' + x.n + '</td><td>' + x.b + '</td><td>' + pct(x.b, x.n) + '%</td><td>' + rs(x.rev) + '</td></tr>'; }
  return h + '</table>';
}
function saveTarget(){
  var sales = Math.max(0, +$('t_sales').value || 0);
  var bills = Math.max(0, +$('t_sales_bills').value || 0);
  if (!sales || !bills) return alert('Enter both the monthly sales and bill targets.');
  if (!CFG.targets) CFG.targets = {};
  var old = CFG.targets[MONTH] || {};
  var oldBills = +(old.bills != null ? old.bills : old.orders) || 0;
  var changed = +old.sales !== sales || oldBills !== bills;
  CFG.targets[MONTH] = {sales:sales, orders:bills, bills:bills};
  saveCfg('').then(function(){
    if (!changed) { renderTarget(); return; }
    db.collection('sales_target_history').add({
      month:MONTH, sales:sales, bills:bills,
      previousSales:+old.sales || 0, previousBills:oldBills,
      changedAt:Date.now(), changedDate:today(), by:USER.email
    }).then(renderTarget).catch(function(err){ alert('Target saved, but history could not be saved: ' + err.message); renderTarget(); });
  });
}
function diagnosisHtml(s, ps){
  var out = [];
  if (!s.n) return '';
  var top = Object.keys(s.reasons).sort(function(a, c){ return s.reasons[c] - s.reasons[a]; });
  if (top.length) out.push('Biggest reason for lost sales: <b>' + esc(top[0]) + '</b> (' + pct(s.reasons[top[0]], s.n - s.b) + '% of lost customers).');
  if (s.lkN >= 3 && pct(s.lkB, s.lkN) < s.conv) out.push('Customers who compared with Lenskart convert worse (' + pct(s.lkB, s.lkN) + '% vs ' + s.conv + '%). Fix the Lenskart comparison: card, signage, pitch.');
  if (ps && ps.n) {
    if (s.n < ps.n) out.push('Fewer logged customers (' + s.n + ' vs ' + ps.n + '). Check whether walk-ins dropped or some visits went unlogged.');
    if (s.conv < ps.conv) out.push('Conversion dropped (' + ps.conv + '% → ' + s.conv + '%). Check the latest change and the staff with the lowest conversion.');
    if (s.avg < ps.avg) out.push('Average bill dropped (' + rs(ps.avg) + ' → ' + rs(s.avg) + '). Review which customer needs and packages were recorded.');
    if (s.rev > ps.rev) out.push('Sales are up ' + rs(s.rev - ps.rev) + ' over the previous 15 days. Compare the logged changes with the results before deciding what to keep.');
  }
  var th = s.test['Tested here'], tn = s.test['Not tested here'];
  if (th && tn && th.n >= 3 && tn.n >= 3 && pct(th.b, th.n) > pct(tn.b, tn.n) + 10) out.push('Eye test here converts ' + pct(th.b, th.n) + '% vs ' + pct(tn.b, tn.n) + '% without. Offer a free eye test to every walk-in.');
  var rp = s.cust['Repeat'];
  if (rp && s.n >= 10) out.push('Repeat customers: ' + pct(rp.n, s.n) + '% of walk-ins, ' + pct(rp.rev, s.rev) + '% of sales.');
  if (s.fuOpen) out.push(s.fuOpen + ' follow-ups still open. Call them before the next review.');
  for (var k in s.staff) { var x = s.staff[k]; if (x.n >= 5 && pct(x.b, x.n) < s.conv - 15) out.push('<b>' + esc(k) + '</b> converts ' + pct(x.b, x.n) + '% vs team ' + s.conv + '%. Needs coaching.'); }
  if (!out.length) return '';
  var h = '<div class="note"><b>What the data says</b><ul style="margin:6px 0 0;padding-left:18px">';
  for (var i = 0; i < out.length; i++) h += '<li style="margin:4px 0">' + out[i] + '</li>';
  return h + '</ul></div>';
}

/* ===== Report ===== */
function periodRange(p){
  var t = today();
  if (p === 'last15') return {from: addDays(t, -14), to: t, label: 'Last 15 days'};
  if (p === 'prev15') return {from: addDays(t, -29), to: addDays(t, -15), label: 'Previous 15 days'};
  if (p === 'month') return {from: t.slice(0, 8) + '01', to: t, label: 'This month'};
  return {from: addDays(t, -89), to: t, label: 'Last 90 days'};
}
function fetchRange(from, to){
  return db.collection('sales_log').where('date', '>=', from).where('date', '<=', to).get().then(function(snap){
    var rows = []; snap.forEach(function(d){ rows.push(d.data()); }); return rows;
  });
}
function staffLabel(value){
  return STAFF_LABELS.indexOf(value) >= 0 ? value : 'Unassigned (older logs)';
}
function stats(rows){
  var s = {n:0, known:0, excluded:0, b:0, rev:0, staff:{}, reasons:{}, tiers:{}, cats:{}, lkN:0, lkB:0, addon:0, att:0, src:{}, cust:{}, test:{}, fuOpen:0, fuWon:0, fuLost:0};
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], staff = staffLabel(r.staff), outcomeKnown = r.bought === true || r.bought === false;
    s.n++;
    if (outcomeKnown) s.known++; else s.excluded++;
    if (!s.staff[staff]) s.staff[staff] = {n:0,b:0,rev:0};
    s.staff[staff].n++;
    if (!s.cats[r.cat]) s.cats[r.cat] = {n:0,b:0,rev:0};
    s.cats[r.cat].n++;
    if (r.lk) { s.lkN++; if (r.bought) s.lkB++; }
    var groups = [['src', r.src || 'Not recorded'], ['cust', r.cust === 'rep' ? 'Repeat' : (r.cust === 'new' ? 'New' : 'Not recorded')], ['test', r.test === true ? 'Tested here' : (r.test === false ? 'Not tested here' : 'Not recorded')]];
    for (var g = 0; g < groups.length; g++) { var gk = groups[g][0], gv = groups[g][1]; if (!s[gk][gv]) s[gk][gv] = {n:0,b:0,rev:0}; s[gk][gv].n++; if (r.bought === true) { s[gk][gv].b++; s[gk][gv].rev += r.amount || 0; } }
    if (r.fu === 'open') s.fuOpen++; else if (r.fu === 'won') s.fuWon++; else if (r.fu === 'lost') s.fuLost++;
    if (r.bought === true) {
      s.b++; s.rev += r.amount || 0;
      s.staff[staff].b++; s.staff[staff].rev += r.amount || 0;
      s.cats[r.cat].b++; s.cats[r.cat].rev += r.amount || 0;
      if (r.tierName) { var key = (CATS[r.cat] || r.cat) + ': ' + r.tierName; s.tiers[key] = (s.tiers[key] || 0) + 1; }
      if (r.addons && r.addons.length) s.addon++;
      if (r.frame === 'att') s.att++;
    } else if (r.bought === false && r.reason) { s.reasons[r.reason] = (s.reasons[r.reason] || 0) + 1; }
  }
  s.conv = pct(s.b, s.known);
  s.avg = s.b ? Math.round(s.rev / s.b) : 0;
  return s;
}
function delta(cur, prev, money){
  if (prev == null) return '';
  var d = cur - prev;
  if (!d) return ' <span class="mut">(same)</span>';
  return ' <span class="' + (d > 0 ? 'ok' : 'bad') + '">' + (d > 0 ? '▲' : '▼') + (money ? rs(Math.abs(d)) : Math.abs(d)) + '</span>';
}
function bars(obj, total){
  var keys = Object.keys(obj).sort(function(a, b){ return obj[b] - obj[a]; });
  if (!keys.length) return '<div class="mut">None</div>';
  var h = '';
  for (var i = 0; i < keys.length; i++) {
    h += '<div style="margin:6px 0">' + esc(keys[i]) + ' <b>' + obj[keys[i]] + '</b><div class="barw"><div class="bar" style="width:' + pct(obj[keys[i]], total) + '%"></div></div></div>';
  }
  return h;
}
var LAST_ROWS = [], LAST_STATS = null, LAST_RANGE = null;

    h2 += '<div>Conversion<b>' + s.conv + '%' + delta(s.conv, ps && ps.conv) + '</b></div>';
    h2 += '<div>Avg bill<b>' + rs(s.avg) + delta(s.avg, ps && ps.avg, true) + '</b></div>';
    h2 += '<div>Sales<b>' + rs(s.rev) + delta(s.rev, ps && ps.rev, true) + '</b></div>';
    h2 += '<div>Compared Lenskart<b>' + s.lkN + '</b><span class="mut">' + s.lkB + ' of them bought (' + pct(s.lkB, s.lkN) + '%)</span></div>';
    h2 += '<div>With add-on<b>' + pct(s.addon, s.b) + '%</b><span class="mut">of sales</span></div>';
    h2 += '<div>Attachment frames<b>' + pct(s.att, s.b) + '%</b><span class="mut">of sales</span></div>';
    h2 += '</div>';
    h2 += '<div class="sec">By staff</div><table><tr><th>Staff</th><th>Customers</th><th>Bought</th><th>Conv.</th><th>Avg bill</th></tr>';
    for (var k in s.staff) { var x = s.staff[k]; h2 += '<tr><td>' + esc(k) + '</td><td>' + x.n + '</td><td>' + x.b + '</td><td>' + pct(x.b, x.n) + '%</td><td>' + rs(x.b ? Math.round(x.rev / x.b) : 0) + '</td></tr>'; }
    h2 += '</table>';
    h2 += '<div class="sec">By product type</div><table><tr><th>Type</th><th>Customers</th><th>Bought</th><th>Conv.</th></tr>';
    for (var c in s.cats) h2 += '<tr><td>' + esc(CATS[c] || c) + '</td><td>' + s.cats[c].n + '</td><td>' + s.cats[c].b + '</td><td>' + pct(s.cats[c].b, s.cats[c].n) + '%</td></tr>';
    h2 += '</table>';
    h2 += groupTable('Where customers came from', s.src);
    h2 += groupTable('New vs repeat', s.cust);
    h2 += groupTable('Eye test here vs outside', s.test);
    h2 += '<div class="sec">Follow-ups</div><div class="mut">Won back ' + s.fuWon + ' · lost ' + s.fuLost + ' · still open ' + s.fuOpen + '</div>';
    h2 += '<div class="sec">Why customers did not buy</div>' + bars(s.reasons, s.n - s.b);
    h2 += '<div class="sec">What sold</div>' + bars(s.tiers, s.b);
    h2 += '<div style="margin-top:14px"><button class="btn pri" onclick="copyReview()">Copy data for 15-day review</button></div>';
    $('rep').className = 'card';
    $('rep').innerHTML = diagnosisHtml(s, ps) + h2;
    loadChanges();
  }).catch(function(err){ if ($('rep') === report) report.innerHTML = '<span class="bad">' + esc(err.message) + '</span>'; });
}
function copyReview(){
  var s = LAST_STATS, rg = LAST_RANGE;
  var t = 'EYELAND SALES DATA — ' + rg.label + ' (' + rg.from + ' to ' + rg.to + ')\n';
  t += 'Customers ' + s.n + ', bought ' + s.b + ', conversion ' + s.conv + '%, sales ' + s.rev + ', avg bill ' + s.avg + '\n';
  t += 'Compared Lenskart ' + s.lkN + ' (bought ' + s.lkB + '), add-on sales ' + s.addon + ', attachment-frame sales ' + s.att + '\n\n';
  t += 'date,staff,wanted,frame,lens,pairs,addons,bought,amount,reason,lenskart,needs,customer,source,eyetest,followup\n';
  for (var i = 0; i < LAST_ROWS.length; i++) {
    var r = LAST_ROWS[i];
    t += [r.date, staffLabel(r.staff), r.cat, r.frame, '"' + (r.tierName || '') + '"', r.pairs, (r.addons || []).join('+'), r.bought ? 'Y' : 'N', r.amount || 0, '"' + (r.reason || '') + '"', r.lk ? 'Y' : 'N', (r.need || []).join('+'), r.cust || '', r.src || '', r.test ? 'Y' : 'N', r.fu || ''].join(',') + '\n';
  }
  t += '\nCURRENT PRICE LIST (updated ' + CFG.updated + ')\n';
  for (var j = 0; j < CFG.sv.length; j++) { var a = CFG.sv[j]; t += 'SV ' + a.id + ' ' + a.name + ': ' + a.price + (a.priceAtt != null ? ' / att ' + a.priceAtt : '') + '\n'; }
  for (var k = 0; k < CFG.prog.length; k++) { var b = CFG.prog[k]; t += 'PROG ' + b.id + ' ' + b.name + ': ' + b.p1 + ' / ' + b.p2 + '\n'; }
  copyText(t);
}

/* ===== Prices & settings ===== */
function renderPrices(){
  var own = isOwner();
  var h = '<div class="card"><h2>Price list</h2><div class="mut">Last updated ' + esc(CFG.updated) + (own ? '. Tap Edit to change a lens. Every change is saved in Changes.' : '. Only the owner can edit.') + '</div></div>';
  h += priceGroup('Single vision · Card A', CFG.sv.filter(function(t){ return t.card === 'A'; }), 'sv', own);
  h += priceGroup('Single vision · Card B', CFG.sv.filter(function(t){ return t.card === 'B'; }), 'sv', own);
  h += priceGroup('Progressive', CFG.prog, 'prog', own);
  if (own) h += settingsHtml();
  $('view').innerHTML = h;
}
function priceGroup(title, list, cat, own){
  var h = '<div class="card"><h3>' + esc(title) + '</h3><table><tr><th>Lens</th><th>' + (cat === 'prog' ? '1 pair' : 'Regular') + '</th><th>' + (cat === 'prog' ? '2 pairs' : 'Attach./Bifocal') + '</th><th></th></tr>';
  for (var i = 0; i < list.length; i++) {
    var t = list[i];
    if (EDIT === t.id) { h += '<tr><td colspan="4">' + editForm(t, cat) + '</td></tr>'; continue; }
    h += '<tr><td><b>' + esc(t.name) + '</b><br><span class="mut">' + esc(t.f.map(fname).join(', ')) + (t.thin ? ', ' + t.thin + '% thinner' : '') + '</span></td>';
    h += cat === 'prog' ? '<td>' + rs(t.p1) + '</td><td>' + rs(t.p2) + '</td>' : '<td>' + rs(t.price) + '</td><td>' + (t.priceAtt != null ? rs(t.priceAtt) : '—') + '</td>';
    h += '<td>' + (own ? '<button class="btn sm" onclick="EDIT=\'' + t.id + '\';renderPrices()">Edit</button>' : '') + '</td></tr>';
  }
  return h + '</table></div>';
}
function editForm(t, cat){
  var h = '<div class="tier rec"><label>Name</label><input id="e_name" value="' + esc(t.name) + '">';
  if (cat === 'prog') {
    h += '<div class="row"><div><label>1 pair ₹</label><input id="e_p1" type="number" value="' + t.p1 + '"></div><div><label>2 pairs ₹</label><input id="e_p2" type="number" value="' + t.p2 + '"></div></div>';
    h += '<label>Corridor (1 Standard … 5 Widest)</label><input id="e_cor" type="number" min="1" max="5" value="' + t.cor + '">';
  } else {
    h += '<div class="row"><div><label>Regular ₹</label><input id="e_price" type="number" value="' + t.price + '"></div><div><label>Attachment/Bifocal ₹ (blank = none)</label><input id="e_att" type="number" value="' + (t.priceAtt == null ? '' : t.priceAtt) + '"></div></div>';
    h += '<label>Warranty</label><input id="e_war" value="' + esc(t.war || '') + '">';
  }
  h += '<label>% thinner (0 = standard)</label><input id="e_thin" type="number" value="' + (t.thin || 0) + '">';
  h += '<label>Best for</label><input id="e_best" value="' + esc(t.best || '') + '">';
  h += '<label>Features</label><div>';
  for (var k in CFG.features) {
    if (k === 'thin' || k === 'corridor') continue;
    h += '<label style="display:inline-block;margin:3px 10px 3px 0;color:#1d1d1f"><input type="checkbox" class="e_f" value="' + k + '" style="width:auto;margin:0 4px 0 0"' + (t.f.indexOf(k) > -1 ? ' checked' : '') + '>' + esc(CFG.features[k].n) + '</label>';
  }
  h += '</div><div style="margin-top:10px"><button class="btn pri" onclick="saveTier(\'' + t.id + '\',\'' + cat + '\')">Save</button> <button class="btn sm" onclick="EDIT=null;renderPrices()">Cancel</button></div></div>';
  return h;
}
function saveTier(id, cat){
  var t = findTier(id);
  var before = cat === 'prog' ? t.p1 + '/' + t.p2 : t.price + '/' + t.priceAtt;
  t.name = $('e_name').value.trim() || t.name;
  if (cat === 'prog') {
    t.p1 = +$('e_p1').value; t.p2 = +$('e_p2').value; t.cor = Math.max(1, Math.min(5, +$('e_cor').value || 1));
  } else {
    t.price = +$('e_price').value;
    t.priceAtt = $('e_att').value === '' ? null : +$('e_att').value;
    t.war = $('e_war').value.trim();
  }
  t.thin = +$('e_thin').value || 0;
  t.best = $('e_best').value.trim();
  var fs = [], boxes = document.querySelectorAll('.e_f');
  for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) fs.push(boxes[i].value);
  t.f = fs;
  var after = cat === 'prog' ? t.p1 + '/' + t.p2 : t.price + '/' + t.priceAtt;
  EDIT = null;
  saveCfg(t.name + ' updated' + (before !== after ? ': price ' + before + ' → ' + after : ' (features/details)')).then(renderPrices);
}
function settingsHtml(){
  var h = '<div class="card"><h3>Settings</h3>';
  h += '<label>Add-on prices</label>';
  for (var i = 0; i < CFG.addons.length; i++) h += '<div class="row"><div style="flex:2;padding-top:12px">' + esc(CFG.addons[i].n) + '</div><div><input id="s_ad_' + CFG.addons[i].id + '" type="number" value="' + CFG.addons[i].p + '"></div></div>';
  h += '<label>Offer rules (one per line)</label><textarea id="s_rules">' + esc(CFG.rules.join('\n')) + '</textarea>';
  h += '<label>Objections (one per line: customer says | staff answer)</label><textarea id="s_obj" style="min-height:160px">' + esc(CFG.objections.map(function(o){ return o.q + ' | ' + o.a; }).join('\n')) + '</textarea>';
  h += '<label>Owner email</label><input value="' + esc(CFG.ownerEmail) + '" disabled>';
  h += '<button class="btn pri" onclick="saveSettings()">Save settings</button></div>';
  return h;
}
function saveSettings(){
  for (var i = 0; i < CFG.addons.length; i++) CFG.addons[i].p = +$('s_ad_' + CFG.addons[i].id).value || 0;
  CFG.rules = $('s_rules').value.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
  CFG.objections = $('s_obj').value.split('\n').map(function(line){
    var p = line.split('|'); return {q: (p[0] || '').trim(), a: p.slice(1).join('|').trim()};
  }).filter(function(o){ return o.q && o.a; });
  saveCfg('Settings updated (add-ons, rules, objections)').then(function(){ alert('Saved.'); renderPrices(); });
}

/* ===== Lenskart ===== */
function renderLk(){
  var own = isOwner();
  var h = '<div class="card"><h2>Launchpad · Lenskart price audit</h2><div class="mut">Enter offers from a report, quote or screenshot. Confirm the same number of pairs, frame inclusion, lens features and warranty before quoting a saving.</div></div>';
  if (own) {
    h += '<div class="card"><h3>Add a price check</h3>';
    h += '<div class="row"><div><label>Date checked</label><input id="k_date" type="date" value="' + today() + '"></div><div><label>Type</label><select id="k_cat" onchange="previewAudit()"><option value="sv">Single vision</option><option value="bif">Bifocal</option><option value="prog">Progressive</option></select></div></div>';
    h += '<label>Lenskart package / lens name</label><input id="k_name">';
    h += '<div class="row"><div><label>Gold member price ₹</label><input id="k_gold" type="number"></div><div><label>Normal price ₹</label><input id="k_norm" type="number"></div></div>';
    h += '<label>What is included (frame, coatings, pairs, warranty)</label><input id="k_feat">';
    h += '<div class="row"><div><label>Pairs in offer</label><select id="k_pairs" onchange="previewAudit()"><option value="2">2 pairs</option><option value="1">1 pair</option></select></div><div><label>Our frame</label><select id="k_frame" onchange="previewAudit()"><option value="reg">Regular</option><option value="att">Attachment</option></select></div></div>';
    h += '<label>Our package</label><select id="k_ours" onchange="previewAudit()"><option value="">Choose a package</option>';
    var all = CFG.sv.concat(CFG.prog);
    for (var i = 0; i < all.length; i++) h += '<option value="' + esc(all[i].id) + '">' + esc(all[i].name) + '</option>';
    h += '</select><label>Source (report, website, store visit, screenshot)</label><input id="k_src">';
    h += '<div id="k_preview"></div><label><input type="checkbox" id="k_match" style="width:auto"> I checked that the frame, pairs, lens features and warranty match the selected Eyeland package.</label>';
    h += '<button class="btn pri" onclick="saveLk()">Save</button></div>';
  }
  h += '<div class="card" id="lkList"><div class="mut">Loading…</div></div>';
  $('view').innerHTML = h;
  var list = $('lkList');
  db.collection('sales_competitor').orderBy('date', 'desc').limit(60).get().then(function(snap){
    var out = '';
    snap.forEach(function(d){
      var x = d.data(), age = daysAgo(x.date), ours = x.ours ? findTier(x.ours) : null;
      out += '<div class="tier"><b>' + esc(CATS[x.cat] || '') + ': ' + esc(x.name) + '</b> ' + (age >= 15 ? '<span class="tag no">check again (' + age + ' days)</span>' : '<span class="tag">' + age + ' days ago</span>');
      out += '<div>' + (x.gold ? 'Gold: <span class="price">' + rs(x.gold) + '</span>' : '') + (x.gold && x.norm ? ' · ' : '') + (x.norm ? 'Normal: ' + rs(x.norm) : '') + '</div>';
      if (x.feat) out += '<div class="mut">Includes: ' + esc(x.feat) + '</div>';
      out += auditComparison(x, ours, age);
      out += '<div class="mut">' + esc(x.date) + (x.src ? ' · ' + esc(x.src) : '') + '</div>';
      if (own) out += '<button class="btn sm del" onclick="delDoc(\'sales_competitor\',\'' + d.id + '\',renderLk)">Delete</button>';
      out += '</div>';
    });
    list.innerHTML = out || '<div class="mut">No prices saved yet.</div>';
  }).catch(function(err){ list.innerHTML = '<span class="bad">' + esc(err.message) + '</span>'; });
}
function previewAudit(){
  $('k_match').checked = false;
  var offer = {cat:$('k_cat').value, frame:$('k_frame').value, pairs:+$('k_pairs').value};
  var ours = findTier($('k_ours').value);
  $('k_preview').innerHTML = ours ? auditComparison(offer, ours, 0) : '';
}
function auditPrice(x, ours){
  if (!ours || ['sv','bif','prog'].indexOf(x.cat) < 0 || tiersFor(x.cat).indexOf(ours) < 0) return null;
  if (x.pairs !== 2 && (x.cat !== 'prog' || x.pairs !== 1)) return null;
  return priceOf(ours, x.cat, x.frame, x.pairs);
}
function auditTerms(x, ours){
  return JSON.stringify([x.cat, x.cat === 'bif' ? 'att' : x.frame, x.pairs, featsOf(ours, x.cat, x.frame).slice().sort(), ours.war || '', ours.thin || 0, ours.cor || 0]);
}
function auditComparison(x, ours, age){
  var price = auditPrice(x, ours);
  if (price == null) return '<div class="mut">No comparable Eyeland price for these pairs and lens type.</div>';
  var frame = x.cat === 'bif' || x.frame === 'att' ? 'attachment frame' : 'regular frame';
  var h = '<div class="say">Eyeland: <b>' + esc(ours.name) + '</b> ' + rs(price) + ' for ' + x.pairs + (x.pairs === 1 ? ' pair' : ' pairs') + ' · ' + frame + '. ' + esc(featsOf(ours, x.cat, x.frame).map(fname).join(', ')) + (ours.war ? ' · Warranty ' + esc(ours.war) : '') + '</div>';
  if (age < 0 || age >= 15 || !x.auditTerms || x.auditTerms !== auditTerms(x, ours)) {
    return h + '<div class="mut">Confirm the offer and matching terms before quoting a price difference.</div>';
  }
  if (x.gold > 0) h += '<div>Compared with Gold: ' + auditDifference(x.gold - price) + '</div>';
  if (x.norm > 0) h += '<div>Compared with normal price: ' + auditDifference(x.norm - price) + '</div>';
  return h + '<div class="mut">Use the price the customer qualifies for. To test a price change, use Prices and check conversion and sales in Review after 15 days.</div>';
}
function auditDifference(diff){
  if (!diff) return 'Same price';
  return 'Eyeland is ' + rs(Math.abs(diff)) + (diff > 0 ? ' lower' : ' higher');
}
function saveLk(){
  var rec = {date: $('k_date').value || today(), cat: $('k_cat').value, name: $('k_name').value.trim(), gold: +$('k_gold').value || 0, norm: +$('k_norm').value || 0, feat: $('k_feat').value.trim(), ours: $('k_ours').value, src: $('k_src').value.trim(), ts: Date.now(), by: USER.email};
  rec.pairs = +$('k_pairs').value;
  rec.frame = rec.cat === 'bif' ? 'att' : $('k_frame').value;
  if (!rec.name || rec.gold < 0 || rec.norm < 0 || (!rec.gold && !rec.norm)) return alert('Enter the package name and at least one price above zero.');
  if (rec.date > today()) return alert('Use the date the offer was checked.');
  if ($('k_match').checked) {
    var ours = findTier(rec.ours);
    if (!rec.feat || !rec.src || auditPrice(rec, ours) == null) return alert('Enter the offer details and source, and choose a package with a price for this lens type and pair count.');
    rec.auditTerms = auditTerms(rec, ours);
  }
  db.collection('sales_competitor').add(rec).then(renderLk).catch(function(err){ alert(err.message); });
}
function delDoc(col, id, after){ if (!confirm('Delete?')) return; db.collection(col).doc(id).delete().then(after); }

/* ===== Changes ===== */
var CH_TYPES = ['Offer','Price list','Signage','Product placement','Staff pitch','Other'];
function changesBlockHtml(){
  var own = isOwner();
  var h = '<div class="card"><h2>Changes and verdicts</h2><div class="mut">Every change to offers, signage, placement or pitch. At each review, give each one a verdict: Keep, Fix or Stop. One main change per 15 days.</div>';
  if (own) {
    h += '<div class="tier"><h3>Add a change</h3><div class="row"><div><label>Date</label><input id="c_date" type="date" value="' + today() + '"></div><div><label>Type</label><select id="c_type">';
    for (var i = 0; i < CH_TYPES.length; i++) h += '<option>' + CH_TYPES[i] + '</option>';
    h += '</select></div></div><label>What changed (where, exact wording)</label><textarea id="c_what" style="min-height:70px"></textarea>';
    h += '<label>Why (what the data showed)</label><input id="c_why"><label>Expected result</label><input id="c_exp" placeholder="e.g. conversion from 55% to 65%"><button class="btn pri" onclick="saveChange()">Save change</button></div>';
  }
  return h + '<div id="chList"><div class="mut">Loading…</div></div></div>';
}
function loadChanges(){
  var own = isOwner();
  db.collection('sales_changes').orderBy('ts', 'desc').limit(60).get().then(function(snap){
    var out = '';
    snap.forEach(function(d){
      var x = d.data(), v = x.verdict || '';
      out += '<div class="tier"><span class="tag">' + esc(x.type) + '</span> <span class="mut">' + esc(x.date) + ' · ' + daysAgo(x.date) + ' days ago</span>';
      if (!v && x.date) {
        var due = addDays(x.date, 15);
        out += ' <span class="tag' + (due <= today() ? ' no' : '') + '">' + (due <= today() ? 'Review due' : 'Review from ' + due) + '</span>';
      }
      if (v) out += ' <span class="tag ' + (v === 'Stop' ? 'no' : '') + '">' + esc(v) + '</span>';
      out += '<div><b>' + esc(x.what) + '</b></div>';
      if (x.why) out += '<div class="mut">Why: ' + esc(x.why) + '</div>';
      if (x.exp) out += '<div class="mut">Expected: ' + esc(x.exp) + '</div>';
      if (own) {
        out += '<label>Result</label><input id="o_' + d.id + '" value="' + esc(x.outcome || '') + '"><div>';
        var vs = ['Keep','Fix','Stop'];
        for (var i = 0; i < vs.length; i++) out += '<button class="btn sm' + (v === vs[i] ? ' on' : '') + '" onclick="saveVerdict(\'' + d.id + '\',\'' + vs[i] + '\')">' + vs[i] + '</button>';
        out += '<button class="btn sm del" onclick="delDoc(\'sales_changes\',\'' + d.id + '\',renderReport)">Delete</button></div>';
      } else if (x.outcome) out += '<div class="say">Result: ' + esc(x.outcome) + '</div>';
      out += '</div>';
    });
    $('chList').innerHTML = out || '<div class="mut">No changes recorded yet.</div>';
  }).catch(function(err){ $('chList').innerHTML = '<span class="bad">' + esc(err.message) + '</span>'; });
}
function saveVerdict(id, v){
  db.collection('sales_changes').doc(id).update({verdict: v, outcome: $('o_' + id).value.trim(), reviewed: today()}).then(loadChanges).catch(function(err){ alert(err.message); });
}
function saveChange(){
  var rec = {date: $('c_date').value || today(), type: $('c_type').value, what: $('c_what').value.trim(), why: $('c_why').value.trim(), exp: $('c_exp').value.trim(), outcome: '', verdict: '', ts: Date.now(), by: USER.email};
  if (!rec.what) return alert('Describe what changed.');
  db.collection('sales_changes').add(rec).then(renderReport).catch(function(err){ alert(err.message); });
}
</script>
</body>
